name: Continuous Benchmark (Go)

on:
  push:
    branches:
      - main
  # Optionally run on a schedule to collect regular data
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: Performance regression check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: stable

      - name: Run Go benchmarks
        run: |
          go version
          # Run all benchmarks without running tests, include memory stats
          go test -bench . -benchmem -run ^$ ./... | tee output.txt

      - name: Store benchmark result to GitHub Pages
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: mdfp Go Benchmarks
          tool: go
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Optional alerting without failing the workflow
          comment-on-alert: true
          alert-threshold: '200%'
